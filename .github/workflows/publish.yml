# Publishes the app to GitHub Pages (https://salshangiti-sys.github.io/home-kitchen/) every time
# something is merged into main, but only if the type check and every test pass.
#
# - Only main triggers it (never a pull request or a fork), so nothing from outside can run here.
# - The two VITE_ values are PUBLIC by design (the Supabase address and its publishable key, which
#   end up in the web page anyway), so they are repository variables, not secrets. No secret is
#   used or needed. Never put the Supabase secret key or the Microsoft client secret here.
# - Actions are pinned to exact commits (the version is in the comment).
# - Run it by hand from the Actions tab ("Run workflow") to republish without a change.

name: Publish the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Public values (see above). The app reads them as soon as it loads, in the tests as well.
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Tests
        run: npx vitest run

      - name: Build for GitHub Pages
        run: npx vite build --mode pages

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    # Only the main branch may publish, even when the workflow is started by hand on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
