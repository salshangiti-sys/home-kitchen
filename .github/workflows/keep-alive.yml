# Calls the keep-alive Edge Function twice a day so the free Supabase project is never paused for
# inactivity (see supabase/functions/keep-alive). Scheduled runs can be delayed or, under heavy
# load, dropped, hence two a day at minutes away from the hour.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the keep-alive function
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 -X POST https://rknhlhrnncmfzkyyzgmd.supabase.co/functions/v1/keep-alive
